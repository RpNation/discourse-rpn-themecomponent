site_max_width:
  type: integer
  default: 1280
  min: 960
  max: 1920
  refresh: true
  description: "Maximum width of the main site content in pixels. Discourse adds the sidebar alongside it."

topic_content_width:
  type: integer
  default: 900
  min: 640
  max: 1200
  refresh: true
  description: "Maximum width of topic and post content in pixels."

desktop_logo_height:
  type: integer
  default: 110
  min: 48
  max: 200
  refresh: true

mobile_logo_height:
  type: integer
  default: 56
  min: 32
  max: 96
  refresh: true

header_links:
  type: objects
  refresh: true
  default:
    - label: "Home"
      icon: "house"
      url: "/"
    - label: "Gallery"
      icon: "images"
      url: ""
    - label: "Staff Contact"
      icon: "envelope"
      url: ""
  schema:
    name: navigation button
    identifier: label
    properties:
      label:
        type: string
        required: true
        validations:
          min_length: 1
          max_length: 60
      icon:
        type: icon
        required: true
      url:
        type: string
        validations:
          max_length: 2048

category_sections:
  type: objects
  default: []
  refresh: true
  schema:
    name: category section
    identifier: heading
    properties:
      heading:
        type: string
        required: true
        validations:
          min_length: 1
          max_length: 120
      category_id:
        type: integer
        required: true
        validations:
          min: 1
