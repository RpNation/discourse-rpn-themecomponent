en:
  whisper_banner:
    title: "Staff whisper"
    audience: "Visible to: %{groups}"
    private_discussion: "Private discussion"
  header_navigation:
    label: "Main navigation"
    coming_soon: "%{label} (coming soon)"
  topic_sections:
    pinned: "Pinned topics"
    normal: "Normal topics"
  category_sections:
    collapse: "Collapse %{heading}"
    expand: "Expand %{heading}"
  category_groups:
    members_label: "Categories in %{name}"
    subcategories_label: "Subforums in %{name}"
  palette_selector:
    title: "Color palettes"
    light: "Light palette"
    dark: "Dark palette"
    mode: "Appearance"
    error: "Could not load this palette. Please try again."
  full_width_toggle: "Full width"
  theme_metadata:
    settings:
      desktop_logo_height: "Maximum logo height in pixels in the branding band above navigation on desktop. Upload the logo in Admin → Appearance → Logo; its proportions are preserved."
      mobile_logo_height: "Maximum logo height in pixels above navigation on phones. Uses the site's mobile logo when configured, otherwise the primary logo."
      header_links:
        description: "Add, remove, or reorder navbar buttons. Leave a URL blank to show a disabled placeholder. Clear the list to hide these buttons. Applies to desktop and mobile."
        schema:
          properties:
            label:
              label: Label
              description: "Button text and accessible name."
            icon:
              label: Icon
              description: "Choose an icon. Narrow screens display the icon instead of the label."
            url:
              label: URL
              description: "Use / for Home, a site path such as /categories, or a full http:// or https:// URL. Leave blank until the destination is ready."
      post_marker_colors:
        description: "Set post-header marker colors by group. The first matching valid rule wins; unmatched posts keep the theme's blue accent. Custom groups match the author's primary group only. Admins, moderators, and staff match their roles. Uses native post data without extra requests. In personal messages, only your own posts show a marker."
        schema:
          properties:
            name:
              label: Name
              description: "A name to identify this rule in settings. It is not displayed on posts."
            group_ids:
              label: Groups
              description: "Choose one or more groups that share this color. A custom group must be the author's primary group and visible to the reader. Admins, moderators, and staff work regardless of primary group. Move this rule above others to give it priority."
            color:
              label: Color
              description: "Enter a 3- or 6-digit hex color, with or without #, such as #FF0000. Rules with invalid colors are ignored."
      category_sections:
        description: "Add collapsible headings above category rows on desktop and mobile. Each browser remembers which sections are collapsed. Starts empty. Category order and permissions are unchanged. Remove an entry to remove its heading."
        schema:
          properties:
            heading:
              label: Heading
              description: "The section heading to display as plain text."
            category_id:
              label: Category ID
              description: "The positive numeric ID of the category that starts this section. Find it in the category URL, for example 123 in /c/category-name/123. Use each ID once; the first matching entry wins."
      category_groups:
        description: "Group top-level categories into one parent-style row on the main Categories page. Supports Categories only, Categories with featured topics, and Categories and latest/top topics on desktop and mobile. Real category parents, permissions, and URLs stay unchanged. Starts empty."
        schema:
          properties:
            name:
              label: Name
              description: "The group name to display as plain text, for example Hosted Projects."
            description:
              label: Description
              description: "Optional plain text beneath the group name."
            icon:
              label: Icon
              description: "Optional icon beside the group name."
            color:
              label: Color
              description: "Optional color for the group's icon and accent. Enter a 3- or 6-digit hex color, with or without #, such as #0088cc. Leave blank to use the first visible member category's color."
            category_ids:
              label: Categories
              description: "Select real top-level categories to display as links in this group. The group appears at its first visible member's position. Subcategories remain within their real parent categories."
